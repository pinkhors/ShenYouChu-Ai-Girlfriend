server:
  port: ${SERVER_PORT:48080}
  shutdown: graceful
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: shenyouchu-core
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:43306/shenyouchu?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${MYSQL_USER:shenyouchu}
    password: ${MYSQL_PASSWORD:syc_dev_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${MYSQL_POOL_SIZE:10}
      minimum-idle: 2
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:46379}
      password: ${REDIS_PASSWORD:syc_dev_redis}
      timeout: 3s

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      # 主键由 MyBatis-Plus 雪花算法生成（申请后回填），不使用数据库自增，见 ADR-0005
      id-type: assign_id
      # deleted_at 为逻辑删除字段：删除写 now(3)，未删除判定为 IS NULL
      logic-delete-field: deletedAt
      logic-delete-value: "now(3)"
      logic-not-delete-value: "null"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

shenyouchu:
  id:
    # 雪花算法实例标识（见 ADR-0005）。本地默认 1/1 仅用于开发；
    # 分布式部署必须保证每个实例的 worker-id + datacenter-id 组合全局唯一。
    worker-id: ${SNOWFLAKE_WORKER_ID:1}
    datacenter-id: ${SNOWFLAKE_DATACENTER_ID:1}
  auth:
    # 会话有效期，默认 30 天
    session-ttl: ${AUTH_SESSION_TTL:30d}
  llm:
    # OpenAI 兼容接口（DashScope compatible-mode、vLLM、Ollama 均可）。
    # enabled=false 时使用确定性占位回复，保证离线可演示。
    enabled: ${LLM_ENABLED:false}
    base-url: ${LLM_BASE_URL:}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:qwen3.7-plus}
    timeout-seconds: ${LLM_TIMEOUT_SECONDS:30}
    max-tokens: ${LLM_MAX_TOKENS:256}
    temperature: ${LLM_TEMPERATURE:0.8}
  voice:
    # false 时使用占位 ASR/TTS（音频按 UTF-8 文本解码、TTS 返回 none），保证离线可演示；
    # true 时调用 asr-url / tts-url 的外部服务，失败自动回退占位实现。
    enabled: ${VOICE_ENABLED:false}
    asr-url: ${VOICE_ASR_URL:}
    tts-url: ${VOICE_TTS_URL:}
    timeout-seconds: ${VOICE_TIMEOUT_SECONDS:30}
  redis:
    # true 时账号删除会清理 Redis 中的会话/临时键（键约定见契约 7.1）。
    enabled: ${REDIS_ENABLED:false}
  storage:
    # true 时账号删除会按 users/{userId}/ 前缀清理 S3 兼容对象存储（本地 MinIO）。
    enabled: ${STORAGE_ENABLED:false}
    endpoint: ${STORAGE_ENDPOINT:http://127.0.0.1:49000}
    access-key: ${STORAGE_ACCESS_KEY:sycminio}
    secret-key: ${STORAGE_SECRET_KEY:syc_dev_minio}
    bucket: ${STORAGE_BUCKET:shenyouchu}
  cors:
    # 桌面端本地开发地址；生产环境改为实际域名
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
