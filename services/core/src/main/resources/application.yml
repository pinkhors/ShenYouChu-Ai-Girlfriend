server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: shenyouchu-core
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:43306/shenyouchu?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${MYSQL_USER:shenyouchu}
    password: ${MYSQL_PASSWORD:syc_dev_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${MYSQL_POOL_SIZE:10}
      minimum-idle: 2
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      # UUID 由应用生成，不使用数据库自增
      id-type: input
      # deleted_at 为逻辑删除字段：删除写 now(3)，未删除判定为 IS NULL
      logic-delete-field: deletedAt
      logic-delete-value: "now(3)"
      logic-not-delete-value: "null"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

shenyouchu:
  auth:
    # 会话有效期，默认 30 天
    session-ttl: ${AUTH_SESSION_TTL:30d}
  cors:
    # 桌面端本地开发地址；生产环境改为实际域名
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
