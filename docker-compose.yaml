# ShenYouChu AI Girlfriend - 本地开发基础设施
#
# 默认启动（M0 必需）：
#   docker compose up -d              -> mysql + redis
#
# 可选完整栈（Milvus 向量库 + S3 兼容对象存储）：
#   docker compose --profile full up -d
#
# 说明：
#   - 所有端口仅绑定 127.0.0.1，避免暴露到局域网。
#   - 默认口令仅供本地开发；请复制 .env.example 为 .env 后按需修改。
#   - MinIO 已停止发布免费 Docker 镜像，本地对象存储暂用 S3 兼容的 RustFS，
#     该配置需在启用 full profile 时验证（见 ADR-0004）。
#   - 生产环境不要直接使用本文件，需另做 TLS、鉴权、备份与资源限制。
#
# 常用命令：
#   docker compose up -d                     启动 M0 基础设施
#   docker compose ps                        查看状态
#   docker compose --profile full up -d      启动含 Milvus 的完整栈
#   docker compose logs -f milvus            查看某个服务日志
#   docker compose down                      停止（保留数据卷）
#   docker compose down -v                   停止并删除数据卷（会清空数据）

name: shenyouchu

services:
  # ---------------------------------------------------------------------------
  # MySQL：权威业务数据（用户、会话、消息、记忆、活动事件、录像元数据）
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: syc-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-syc_dev_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-shenyouchu}
      MYSQL_USER: ${MYSQL_USER:-shenyouchu}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-syc_dev_pass}
      TZ: UTC
    ports:
      - "127.0.0.1:${MYSQL_PORT:-43306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - shenyouchu

  # ---------------------------------------------------------------------------
  # Redis：会话与轮次临时状态、限流、媒体绑定；只存带 TTL 的临时数据
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: syc-redis
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD:-syc_dev_redis}",
      ]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-syc_dev_redis}
      TZ: UTC
    ports:
      - "127.0.0.1:${REDIS_PORT:-46379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - shenyouchu

  # ---------------------------------------------------------------------------
  # 以下服务仅在 --profile full 时启动
  # ---------------------------------------------------------------------------

  # S3 兼容对象存储：录像文件与 Milvus 后端存储。
  # 暂用 RustFS 替代已停止分发镜像的 MinIO，配置待验证（ADR-0004）。
  rustfs:
    image: rustfs/rustfs:latest
    container_name: syc-rustfs
    restart: unless-stopped
    profiles: ["full"]
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-sycminio}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-syc_dev_minio}
      RUSTFS_VOLUMES: /data
      TZ: UTC
    ports:
      - "127.0.0.1:${S3_API_PORT:-49000}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT:-49001}:9001"
    volumes:
      - rustfs_data:/data
    networks:
      - shenyouchu

  # etcd：Milvus 元数据依赖，不需要对外暴露端口
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: syc-etcd
    restart: unless-stopped
    profiles: ["full"]
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
      TZ: UTC
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - shenyouchu

  # Milvus standalone：长期记忆语义检索（P2 启用前可先不启动）
  milvus:
    image: milvusdb/milvus:v2.4.0
    container_name: syc-milvus
    restart: unless-stopped
    profiles: ["full"]
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: rustfs:9000
      MINIO_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-sycminio}
      MINIO_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-syc_dev_minio}
      MINIO_BUCKET_NAME: milvus
      MINIO_USE_SSL: "false"
      COMMON_STORAGETYPE: minio
      TZ: UTC
    ports:
      - "127.0.0.1:${MILVUS_PORT:-49530}:19530"
      - "127.0.0.1:${MILVUS_METRICS_PORT:-49091}:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      rustfs:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 90s
    networks:
      - shenyouchu

volumes:
  mysql_data:
    name: shenyouchu-mysql-data
  redis_data:
    name: shenyouchu-redis-data
  rustfs_data:
    name: shenyouchu-rustfs-data
  etcd_data:
    name: shenyouchu-etcd-data
  milvus_data:
    name: shenyouchu-milvus-data

networks:
  shenyouchu:
    name: shenyouchu-net
    driver: bridge
